<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>硬體工程師速算工具</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; line-height: 1.6; color: #333; }
  .container { max-width: 820px; margin: auto; }
  .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
  .status-bar { text-align: center; font-size: 0.85em; margin-bottom: 20px; color: #e74c3c; font-weight: bold; }
  .status-bar.ok { color: #27ae60; }
  h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; margin-top: 0; font-size: 1.2em; }
  input, select { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
  input[type="number"] { width: 90px; }
  button { padding: 8px 15px; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 4px; transition: background 0.2s; font-weight: 600; }
  button:hover { background-color: #2980b9; }
  button:active { transform: translateY(1px); }
  .btn-secondary { background-color: #7f8c8d; font-size: 0.85em; padding: 6px 12px; }
  .btn-secondary:hover { background-color: #636e72; }
  .res { font-weight: bold; color: #e67e22; }
  .err { font-weight: bold; color: #e74c3c; }
  .sub-group { background-color: #f8f9fa; padding: 10px 12px; border-radius: 6px; margin: 8px 0; border-left: 4px solid #3498db; }
  .sub-group label { display: inline-block; min-width: 75px; font-weight: 600; font-size: 0.9em; color: #2c3e50; }
  .std-res-box { margin-top: 8px; font-size: 0.9em; color: #2c3e50; background: #fff8e1; padding: 8px 12px; border-radius: 4px; border: 1px solid #ffe082; }
</style>
</head>
<body>

<div class="container">
  <h1>硬體工程師速算工具</h1>
  <div id="js_status" class="status-bar">🔴 腳本尚未載入 (請檢查程式碼是否複製完整)</div>

  <!-- 1. 分壓計算 -->
  <div class="card">
    <h2>1. 分壓計算 (Vout)</h2>
    Vin: <input type="number" id="vin" step="any" placeholder="Vin (V)">
    Ru: <input type="number" id="ru" step="any" placeholder="Ru (Ω/kΩ)">
    Rd: <input type="number" id="rd" step="any" placeholder="Rd (Ω/kΩ)">
    <button type="button" onclick="calcVoltage()">計算 Vout</button>
    <p>Vout = <span id="vout_res" class="res">0</span> V</p>
  </div>

  <!-- 2. 加熱片功率推算 -->
  <div class="card">
    <h2>2. 加熱片功率推算 (P=VI, V=IR)</h2>
    <small>請輸入任意兩項進行推算：</small><br>
    P (W): <input type="number" id="p_p" step="any" placeholder="W">
    V (V): <input type="number" id="p_v" step="any" placeholder="V">
    I (A): <input type="number" id="p_i" step="any" placeholder="A">
    R (Ω): <input type="number" id="p_r" step="any" placeholder="Ω">
    <button type="button" onclick="calcHeat()">推算</button>
    <button type="button" class="btn-secondary" onclick="clearHeat()">清空</button>
    <p id="heat_res" class="res">請輸入任意兩項數值</p>
  </div>

  <!-- 3. 電池續航計算 -->
  <div class="card">
    <h2>3. 電池續航計算</h2>
    容量 (mAh): <input type="number" id="bat_cap" step="any" placeholder="mAh">
    電壓 (V): <input type="number" id="bat_v" step="any" placeholder="V">
    功率 (W): <input type="number" id="bat_p" step="any" placeholder="W">
